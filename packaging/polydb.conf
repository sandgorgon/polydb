# PolyDB server settings (polydb serve --config /etc/polydb/polydb.conf).
# Each line is `key = value`, the key being a `polydb serve` flag's name.
# Flags given on the command line override this file. Sizes take units:
# KiB, MiB, GiB, TiB (or KB, MB, GB, TB); durations Go's form: 30s, 5m, 1h.

# Where the data, the server's 9auth identity and its socket live.
data-dir = /var/lib/polydb

# The Unix socket. The OS user running the server is admin over it; "none"
# turns it off.
socket = /run/polydb/polydb.sock

# TCP, with TLS from the server's 9auth identity (or tls-cert/tls-key for
# a CA-signed certificate). Leave empty for no TCP.
listen = :7377
# tls-cert = /etc/polydb/tls/cert.pem
# tls-key = /etc/polydb/tls/key.pem

# durable: a commit is on stable storage before it is acknowledged.
# relaxed: synced in the background, for bulk loads.
durability = durable

# Where backup, restore, export and import statements read and write.
# backup-dir = /var/lib/polydb/backups

# Limits (spec/rhizome.md §4). A negative value means no limit.
# statement-timeout = 5m
max-memory = 1GiB
max-connections = 1000
max-user-connections = 100
max-transactions = 16
max-upload = 4GiB
upload-quota = 16GiB

# Statements at least this slow go to the log with their plan (0: off).
slow-query = 1s

# compression = false
# inline-limit = 16KiB
# v = false
